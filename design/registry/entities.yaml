# Game World Entity Registry
#
# PURPOSE: Single source of truth for all named game-world facts that appear
# in more than one document. Skills check this before writing new content to
# detect cross-doc inconsistencies at authoring time.
#
# RULES:
#   - Only register facts that cross system boundaries. Internal-only facts
#     (a formula used in one GDD only) do NOT need to be registered.
#   - Never delete entries — set status: deprecated instead.
#   - When a value changes: update the value, set revised: to today's date,
#     and add a comment with the old value and which GDD changed it.
#   - source: is the authoritative GDD — the one that "owns" this fact.
#     Other GDDs that reference it list themselves in referenced_by.
#   - When a new GDD references an existing entry, append its path to
#     referenced_by. Do not create a duplicate entry.
#
# WRITTEN BY: /design-system (Phase 5 — after GDD sections are approved)
#             /consistency-check (when resolving conflicts)
# READ BY:    /design-system (Phase 2 — before authoring begins, and after
#               Section C/D writes to conflict-check new entities/formulas)
#             /consistency-check (primary input — grep-first, GDD-second)
#             /review-all-gdds (Phase 1 — baseline for Phase 2 checks)
#             /architecture-review (data structure and interface validation)
#
# SEARCH PATTERNS (for skills using Grep):
#   All entity names:        Grep pattern="^  - name:" path="design/registry/entities.yaml"
#   Specific entity:         Grep pattern="  - name: goblin" path="design/registry/entities.yaml"
#   All items:               Grep pattern="^  - name:" path="design/registry/entities.yaml" (items section)
#   What combat.md owns:     Grep pattern="source: design/gdd/combat.md"
#   What inventory.md uses:  Grep pattern="referenced_by.*inventory"
#   All gold values:          Grep pattern="value_gold:"
#   Deprecated entries:      Grep pattern="status: deprecated"
#
# FORMAT: YAML. Consistent indentation is critical for grep reliability.
#   Sections: entities | items | formulas | constants
#   Each entry: name, status, source, referenced_by[], attributes{}, added, revised

version: 1
last_updated: "2026-05-03"  # updated: added ACTIVITY to engagementType enum + scene-activity-loop.md to referenced_by after scene-activity-loop.md GDD completion

# ─── ENTITIES ────────────────────────────────────────────────────────────────
# Named game-world objects: enemies, NPCs, characters, factions, bosses.
# Register an entity here when it appears in more than one GDD — e.g., an
# enemy defined in combat.md that also drops items listed in inventory.md.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: any key stats that could appear in another GDD
#   (health, damage, drops, faction, etc.)

entities: []

# Example (remove when first real entry is added):
#
# entities:
#   - name: goblin
#     status: active              # active | deprecated
#     source: design/gdd/combat.md
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md
#     health: 40
#     damage: 8
#     drops:
#       - item: goblin_arm        # must match an entry in items section
#         qty: 1
#         drop_rate: 0.8          # 0.0–1.0
#     added: 2026-03-26
#     revised: ""


# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items: []

# Example:
#
# items:
#   - name: goblin_arm
#     status: active
#     source: design/gdd/combat.md   # drop defined in combat GDD
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md    # inventory GDD lists its weight/stack rules
#       - design/gdd/economy.md      # economy GDD references its sell price
#     value_gold: 5
#     weight: 1
#     stackable: true
#     category: crafting_material
#     added: 2026-03-26
#     revised: ""


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas: []

# Example:
#
# formulas:
#   - name: damage_formula
#     status: active
#     source: design/gdd/combat.md
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/progression.md   # progression GDD scales attack variable
#     variables:
#       - attack
#       - defense
#       - crit_chance
#       - crit_multiplier
#     output_range: [0, 999]
#     expression: "max(0, attack - defense) * (1 + crit_chance * crit_multiplier)"
#     notes: "Output feeds into health-system damage intake. Min is 0 (armour
#       can absorb all damage). Max is uncapped in formula but tuning knob
#       damage_cap in combat.md clamps at 999."
#     added: 2026-03-26
#     revised: ""


# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

constants:
  - name: depth_tier
    status: active
    source: design/gdd/character-state-manager.md
    referenced_by:
      - design/gdd/character-state-manager.md
      - design/gdd/dialogue-narrative-engine.md
      - design/gdd/audio-system.md
    value_type: int
    value_range: "[0, 5]"
    default: 0
    unit: tier
    notes: "Per-character relationship depth. 0=surface, 5=secret revealed and processed. Write owner: Relationship Depth System. Invariant: depth_tier==5 implies secret_revealed==true."
    added: "2026-05-02"
    revised: ""

  - name: closed_off
    status: active
    source: design/gdd/character-state-manager.md
    referenced_by:
      - design/gdd/character-state-manager.md
      - design/gdd/dialogue-narrative-engine.md
      - design/gdd/the-dig.md
      - design/gdd/audio-system.md
    value_type: bool
    default: false
    unit: flag
    notes: "Per-character withdrawal flag. Recoverable — not permanent. Write owner: The Dig. Does NOT lower depth_tier."
    added: "2026-05-02"
    revised: ""

  - name: secret_revealed
    status: active
    source: design/gdd/character-state-manager.md
    referenced_by:
      - design/gdd/character-state-manager.md
      - design/gdd/dialogue-narrative-engine.md
      - design/gdd/the-dig.md
      - design/gdd/audio-system.md
      - design/gdd/secret-reveal-system.md
    value_type: bool
    default: false
    unit: flag
    notes: "Per-character secret surfacing flag. Never reverts once true at depth_tier==5. Write owner: CSM (auto-set on SetDepthTier(charId,5)). Primary consumer: Secret Reveal System (reads as arc entry condition). One-directional invariant: depth_tier==5 requires secret_revealed==true."
    added: "2026-05-02"
    revised: "2026-05-04"  # added secret-reveal-system.md to referenced_by; clarified write owner is CSM (auto-set); CSM GDD write-ownership table corrected (was: SRS writes via SetSecretRevealed — now: CSM auto-sets on SetDepthTier(charId,5), SRS read-only)

  - name: reveal_arc_in_progress
    status: active
    source: design/gdd/secret-reveal-system.md
    referenced_by:
      - design/gdd/secret-reveal-system.md
      - design/gdd/save-load-system.md
    value_type: bool
    default: false
    unit: narrative_flag
    notes: "Reserved narrative_flags key in CSM. Written true by Secret Reveal System at arc entry. Cleared to false by SRS at ARC_COMPLETE. Combined with reveal_arc_last_completed_scene to drive crash-resume arc resumption on session start. Never written by any other system."
    added: "2026-05-04"
    revised: ""

  - name: reveal_arc_last_completed_scene
    status: active
    source: design/gdd/secret-reveal-system.md
    referenced_by:
      - design/gdd/secret-reveal-system.md
      - design/gdd/save-load-system.md
    value_type: string
    default: "null"
    unit: narrative_flag
    notes: "Reserved key in CSM holding the node name of the last completed revelation arc scene (buildUpNodeName, disclosureNodeName, or null). Written by Secret Reveal System at each SceneComplete callback; cleared at ARC_COMPLETE. SCHEMA GAP: current narrative_flags is Dictionary<string,bool>; a narrative_strings field or equivalent is required. See OQ-1 in secret-reveal-system.md."
    added: "2026-05-04"
    revised: ""

  - name: MAX_DEPTH_TIER
    status: active
    source: design/gdd/character-state-manager.md
    referenced_by:
      - design/gdd/character-state-manager.md
      - design/gdd/relationship-depth-system.md
      - design/gdd/save-load-system.md
    value: 5
    unit: tier
    notes: "Maximum depth tier value. Hard-coded constant. Changing requires updating all downstream GDDs and a save migration. Safe range [3, 7] per tuning knobs analysis."
    added: "2026-05-02"
    revised: ""

  - name: engagementType
    status: active
    source: design/gdd/relationship-depth-system.md
    referenced_by:
      - design/gdd/relationship-depth-system.md
      - design/gdd/scene-management.md
      - design/gdd/scene-activity-loop.md
    value_type: enum
    values: ["CORE", "DEPTH", "AMBIENT", "RECOVERY", "ACTIVITY"]
    unit: enum
    notes: "Scene classification enum. CORE and DEPTH count toward SCENES_REQUIRED threshold for tier advancement. AMBIENT does not count. RECOVERY is used for closed_off recovery arcs only. ACTIVITY (added by scene-activity-loop.md) does not count toward threshold; participates in full COMPLETING accounting chain including dig_partial_cooldown clearance. Scene Registry (owned by scene-management.md) must tag every scene with one of these five values. Scene Management startup validator must accept ACTIVITY as a valid value."
    added: "2026-05-03"
    revised: "2026-05-03"  # was: 4 values [CORE, DEPTH, AMBIENT, RECOVERY] — ACTIVITY added by scene-activity-loop.md GDD

  - name: DISPLAY_NAME_MAX_LENGTH
    status: active
    source: design/gdd/player-profile.md
    referenced_by:
      - design/gdd/player-profile.md
      - design/gdd/text-substitution-system.md
    value: 30
    unit: characters
    notes: "Maximum character length for the player's display name. text-substitution-system.md FALLBACK_DISPLAY_NAME safe range is bounded by this value. Increasing risks layout overflow in dialogue boxes."
    added: "2026-05-03"
    revised: ""

  - name: DigOutcome
    status: active
    source: design/gdd/the-dig.md
    referenced_by:
      - design/gdd/the-dig.md
      - design/gdd/relationship-depth-system.md
      - design/gdd/save-load-system.md
      - design/gdd/scene-management.md
    value_type: enum
    values: ["DIG_PASS", "DIG_PARTIAL", "DIG_FAIL", "DIG_CRITICAL_FAIL"]
    unit: enum
    notes: "The four outcomes of a Dig interaction. DIG_PASS: tier advances via RDS. DIG_PARTIAL: cooldown flag set, one-scene cooldown enforced by RDS. DIG_FAIL: closed_off=true written by The Dig. DIG_CRITICAL_FAIL: closed_off=true + dig_critical_failed flag written by The Dig; requires pre-existing narrative flag to trigger. Scene Management interprets DigComplete(charId, result) using these values."
    added: "2026-05-03"
    revised: ""

  - name: dig_partial_cooldown
    status: active
    source: design/gdd/the-dig.md
    referenced_by:
      - design/gdd/the-dig.md
      - design/gdd/relationship-depth-system.md
    value_type: bool
    default: false
    unit: narrative_flag
    notes: "Reserved narrative_flags key in CSM. Written true by The Dig on DIG_PARTIAL. Cleared to false by RDS after one scene of any engagementType completes for this character. While true, IsDigAvailable(charId) returns false."
    added: "2026-05-03"
    revised: ""

  - name: dig_critical_failed
    status: active
    source: design/gdd/the-dig.md
    referenced_by:
      - design/gdd/the-dig.md
      - design/gdd/relationship-depth-system.md
    value_type: bool
    default: false
    unit: narrative_flag
    notes: "Reserved narrative_flags key in CSM. Written true by The Dig on DIG_CRITICAL_FAIL. Never cleared — permanent per-character flag. Acts as a gate for a harder recovery arc (authored separately from the standard DIG_FAIL recovery arc). Idempotent: writing true when already true has no effect."
    added: "2026-05-03"
    revised: ""

# Example:
#
# constants:
#   - name: gold_carry_limit
#     status: active
#     source: design/gdd/economy.md
#     referenced_by:
#       - design/gdd/economy.md
#       - design/gdd/inventory.md   # inventory enforces the carry limit
#       - design/gdd/ui.md          # HUD displays current gold vs limit
#     value: 9999
#     unit: gold
#     added: 2026-03-26
#     revised: ""
#
#   - name: base_inventory_slots
#     status: active
#     source: design/gdd/inventory.md
#     referenced_by:
#       - design/gdd/inventory.md
#       - design/gdd/progression.md  # progression unlocks additional slots
#     value: 20
#     unit: slots
#     added: 2026-03-26
#     revised: ""
